# Ruff configuration for ClearThread
# See: https://docs.astral.sh/ruff/configuration/

target-version = "py310"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "PT",   # pytest
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line too long (formatter handles this)
    "W191", # tab indentation
    "T201", # print statements allowed in dev
]

[lint.pydocstyle]
convention = "google"

[lint.pytest]
# Mark slow tests
testpaths = ["tests"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[lint.isort]
known-first-party = ["clearthread"]
combine-as-imports = true
